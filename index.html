<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختصاراتي</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --accent-text: #ffffff;
    --danger: #dc2626; --warn-bg: #fff7e6; --warn: #9a5b00;
    --ok-bg: #e8f7ee; --ok: #16794a; --err-bg: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1e232b; --text: #e7eaf0; --muted: #9aa3b2;
      --line: #2e3540; --accent: #4f8cff; --danger: #f26b6b;
      --warn-bg: #3a2e14; --warn: #f5c46b; --ok-bg: #163324; --ok: #6fdc9f; --err-bg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Segoe UI", Tahoma, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  button.lang { padding: 4px 12px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .form { display: grid; grid-template-columns: 200px 1fr; gap: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  textarea { min-height: 44px; height: 44px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 16px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 13px; color: var(--muted); }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 10px; }
  .msg { border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.err { background: var(--err-bg); color: var(--danger); }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 8px; gap: 10px; }
  .list-head h2 { font-size: 16px; margin: 0; }
  .item { display: grid; grid-template-columns: 160px 1fr auto; gap: 12px; align-items: center;
          padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item.editing { background: var(--bg); }
  .trigger { font-family: Consolas, "Courier New", monospace; font-weight: 600; unicode-bidi: plaintext; word-break: break-all; }
  .replace { white-space: pre-wrap; word-break: break-word; unicode-bidi: plaintext; text-align: start; }
  .item .btns { display: flex; gap: 6px; }
  .item .btns button { padding: 4px 10px; font-size: 13px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .file { font-size: 12px; color: var(--muted); margin-top: 18px; direction: ltr; text-align: left; word-break: break-all; }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    .form { grid-template-columns: 1fr; }
    .item { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-t="title">اختصاراتي</h1>
    <button id="lang" class="lang" type="button">English</button>
  </div>
  <div id="msg" class="msg" hidden></div>

  <div class="card">
    <div class="form">
      <div>
        <label for="trigger" data-t="trigger">الاختصار</label>
        <input id="trigger" dir="auto" autocomplete="off" spellcheck="false" placeholder=";sig">
      </div>
      <div>
        <label for="replace" data-t="replace">الجملة كاملة</label>
        <textarea id="replace" dir="auto"></textarea>
      </div>
    </div>
    <div id="warn" class="warn" hidden></div>
    <div class="actions">
      <button id="save" class="primary">إضافة</button>
      <button id="cancel" data-t="cancel" hidden>إلغاء التعديل</button>
      <span class="hint" data-t="hint">Ctrl + Enter للحفظ السريع</span>
    </div>
  </div>

  <div class="list-head">
    <h2 id="count"></h2>
  </div>
  <div class="card" style="padding:0" id="list"></div>
  <div class="file" id="file"></div>
</main>

<script>
const TOKEN = "__TOKEN__";
let matches = [];
let editIndex = -1;
let readonly = false;

// ---------- اللغة ----------
const STRINGS = {
  ar: {
    title: "اختصاراتي",
    trigger: "الاختصار",
    replace: "الجملة كاملة",
    replacePh: "مثال: مع خالص التحية",
    add: "إضافة",
    saveEdit: "حفظ التعديل",
    cancel: "إلغاء التعديل",
    hint: "Ctrl + Enter للحفظ السريع",
    edit: "تعديل",
    del: "حذف",
    empty: "أضف أول اختصار من الأعلى",
    otherLang: "English",
    count: n => n === 0 ? "لا توجد اختصارات" : n === 1 ? "اختصار واحد" : n === 2 ? "اختصاران"
      : n <= 10 ? String(n) + " اختصارات" : String(n) + " اختصارًا",
    warnDup: "هذا الاختصار موجود من قبل.",
    warnSpace: "انتبه: في الاختصار مسافة في البداية أو النهاية.",
    warnShort: t => "اختصار قصير من حروف فقط قد ينطلق وأنت تكتب كلمات عادية. يُفضَّل أن يبدأ برمز مثل ; أو : (مثال: ;" + t + ")",
    needTrigger: "اكتب الاختصار أولًا",
    needReplace: "اكتب الجملة الكاملة",
    exists: t => "الاختصار «" + t + "» موجود من قبل",
    saved: "تم حفظ التعديل",
    added: t => "تمت إضافة «" + t + "»، جرّبه الآن في أي برنامج",
    confirmDel: t => "حذف الاختصار «" + t + "»؟",
    deleted: "تم الحذف",
    readonly: e => "لن أعدّل الملف لأنه يحتوي على صيغة لا تدعمها الواجهة، حتى لا يتلف. التفاصيل: " + e,
  },
  en: {
    title: "My Shortcuts",
    trigger: "Shortcut",
    replace: "Full text",
    replacePh: "e.g. Best regards",
    add: "Add",
    saveEdit: "Save changes",
    cancel: "Cancel editing",
    hint: "Ctrl + Enter to save",
    edit: "Edit",
    del: "Delete",
    empty: "Add your first shortcut above",
    otherLang: "عربي",
    count: n => n === 0 ? "No shortcuts" : n === 1 ? "1 shortcut" : String(n) + " shortcuts",
    warnDup: "This shortcut already exists.",
    warnSpace: "Careful: the shortcut starts or ends with a space.",
    warnShort: t => "A short letters-only shortcut may fire while typing normal words. Better start it with a symbol like ; or : (e.g. ;" + t + ")",
    needTrigger: "Type the shortcut first",
    needReplace: "Type the full text",
    exists: t => "The shortcut “" + t + "” already exists",
    saved: "Changes saved",
    added: t => "Added “" + t + "”. Try it now in any app",
    confirmDel: t => "Delete the shortcut “" + t + "”?",
    deleted: "Deleted",
    readonly: e => "The file won't be changed because it contains syntax the UI doesn't support, so it can't be damaged. Details: " + e,
  },
};

function pickLang() {
  try {
    const saved = localStorage.getItem("lang");
    if (saved === "ar" || saved === "en") return saved;
  } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";
}
let lang = pickLang();
const T = () => STRINGS[lang];

function applyLang() {
  const s = T();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = s.title;
  document.querySelectorAll("[data-t]").forEach(el => (el.textContent = s[el.dataset.t]));
  $("replace").placeholder = s.replacePh;
  $("save").textContent = editIndex >= 0 ? s.saveEdit : s.add;
  $("lang").textContent = s.otherLang;
  checkWarn();
  render();
}

// ---------- الواجهة ----------
const $ = id => document.getElementById(id);
const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { "X-Token": TOKEN, "X-Lang": lang, "Content-Type": "application/json" } })
    .then(r => r.json());

function showMsg(text, ok) {
  const m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
  m.hidden = false;
  clearTimeout(showMsg.t);
  if (ok) showMsg.t = setTimeout(() => (m.hidden = true), 3000);
}

function render() {
  const s = T();
  $("count").textContent = s.count(matches.length);
  const list = $("list");
  list.innerHTML = "";
  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = s.empty;
    list.append(empty);
    return;
  }
  matches.forEach((m, i) => {
    const row = document.createElement("div");
    row.className = "item" + (i === editIndex ? " editing" : "");
    const t = document.createElement("div"); t.className = "trigger"; t.textContent = m.trigger;
    const r = document.createElement("div"); r.className = "replace"; r.textContent = m.replace;
    const b = document.createElement("div"); b.className = "btns";
    const edit = document.createElement("button"); edit.textContent = s.edit;
    edit.onclick = () => startEdit(i);
    const del = document.createElement("button"); del.textContent = s.del; del.className = "danger";
    del.onclick = () => remove(i);
    edit.disabled = del.disabled = readonly;
    b.append(edit, del);
    row.append(t, r, b);
    list.append(row);
  });
}

function checkWarn() {
  const s = T();
  const t = $("trigger").value;
  const w = $("warn");
  let text = "";
  const dup = matches.findIndex(m => m.trigger === t);
  if (t && dup !== -1 && dup !== editIndex) text = s.warnDup;
  else if (t.trim() !== t && t) text = s.warnSpace;
  else if (/^[\p{L}\p{N}]{1,2}$/u.test(t)) text = s.warnShort(t);
  w.textContent = text;
  w.hidden = !text;
}

async function persist(next, okText) {
  const res = await api("/api/save", { method: "POST", body: JSON.stringify({ matches: next }) });
  if (res.ok) {
    matches = res.matches;
    showMsg(okText, true);
    return true;
  }
  showMsg(res.error, false);
  return false;
}

async function submit() {
  if (readonly) return;
  const s = T();
  const trigger = $("trigger").value;
  const replace = $("replace").value;
  if (!trigger.trim()) { showMsg(s.needTrigger, false); $("trigger").focus(); return; }
  if (!replace) { showMsg(s.needReplace, false); $("replace").focus(); return; }
  const dup = matches.findIndex(m => m.trigger === trigger);
  if (dup !== -1 && dup !== editIndex) { showMsg(s.exists(trigger), false); return; }

  const next = matches.map(m => ({ ...m }));
  let okText;
  if (editIndex >= 0) {
    next[editIndex] = { ...next[editIndex], trigger, replace };
    okText = s.saved;
  } else {
    next.push({ trigger, replace });
    okText = s.added(trigger);
  }
  $("save").disabled = true;
  const ok = await persist(next, okText);
  $("save").disabled = false;
  if (ok) resetForm();
  render();
}

function startEdit(i) {
  editIndex = i;
  $("trigger").value = matches[i].trigger;
  $("replace").value = matches[i].replace;
  $("save").textContent = T().saveEdit;
  $("cancel").hidden = false;
  checkWarn();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
  $("replace").focus();
}

function resetForm() {
  editIndex = -1;
  $("trigger").value = "";
  $("replace").value = "";
  $("save").textContent = T().add;
  $("cancel").hidden = true;
  checkWarn();
  $("trigger").focus();
}

async function remove(i) {
  const s = T();
  if (!confirm(s.confirmDel(matches[i].trigger))) return;
  const next = matches.filter((_, j) => j !== i);
  if (await persist(next, s.deleted)) {
    if (editIndex === i) resetForm();
    else if (editIndex > i) editIndex--;
  }
  render();
}

async function load() {
  const res = await api("/api/matches");
  $("file").textContent = res.file;
  if (res.ok) {
    matches = res.matches;
  } else {
    readonly = true;
    $("save").disabled = true;
    showMsg(T().readonly(res.error), false);
  }
  render();
}

$("lang").onclick = () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  $("msg").hidden = true;
  applyLang();
  if (readonly) load();  // رسالة الخطأ تأتي من البرنامج فنطلبها باللغة الجديدة
};
$("save").onclick = submit;
$("cancel").onclick = () => { resetForm(); render(); };
$("trigger").oninput = checkWarn;
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); submit(); }
  if (e.key === "Escape" && editIndex >= 0) { resetForm(); render(); }
});
$("trigger").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.ctrlKey) { e.preventDefault(); $("replace").focus(); }
});

applyLang();
setInterval(() => api("/api/ping").catch(() => {}), 2000);
load().then(() => $("trigger").focus());
</script>
</body>
</html>
